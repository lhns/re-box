[project]
name = "rebox-aggregator"
version = "0.1.0"
description = "Per-session stdio MCP aggregator and container supervisor for re-box"
requires-python = ">=3.12"
dependencies = [
    "mcp==2.3.0",
    "anyio==4.15.1",
    "httpx2==2.14.0",
    "uvicorn==0.54.0",
]

[project.scripts]
rebox-supervisor = "rebox_aggregator.supervisor:main"
rebox-aggregator = "rebox_aggregator.app:main"

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-timeout==2.4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rebox_aggregator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
