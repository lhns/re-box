# Children of each MCP session (aggregator/README.md, "Configuration"). [child.env] values are
# forced over the container env; everything else is inherited minus REBOX_*.

# What a client cannot see from the tool list. `instructions` goes into every initialize result
# ({NAME}: an environment variable; the session adds its state dir, tag and evidence file). The other
# two answer a call to a cached tool that waits for the shared backend (Ghidra) in vain.
[session]
instructions = '''
re-box: Ghidra (ghidra_ tools) and REA (rea_ tools) behind one endpoint.
ghidra_: one persistent Ghidra project shared by all sessions. Pass the program selector on every call; ghidra_import_file only reads files under RE_WORKDIR ({RE_WORKDIR}).
rea_: REA works in the same Ghidra project: rea_open_binary imports the file into /rea/<sha12>-<profile8>/<file name> (the first 12 hex digits of the file's sha256 and 8 of REA's profile digest; open it with ghidra_ tools there), and REA's renames and comments persist, whatever REA's own texts say about an ephemeral project. rea_ tools see edits made meanwhile by ghidra_ tools or other sessions. REA's evidence and in-session state still end with the session.
Paths: the container sees host paths unchanged (same-path mount). On Windows send the Git Bash form (/c/Users/you/re/x.bin), not C:\... .
Ghidra starts with the first session (about 40 s). A ghidra_ call made while it starts waits for it; if it fails you get a tool error saying why.'''
backend_failed = "Ghidra is {state}: {reason}. Try again later."
backend_starting = "Ghidra is still starting after {seconds} s. Try again later."

[[child]]
name = "rea"
prefix = "rea_"
command = ["/usr/local/bin/rea", "mcp"]
# REA's Ghidra sessions run in the ghidra-mcp JVM on the shared project (deps/rea-attach): REA's
# patched launcher starts this helper instead of its own JVM. To debug with REA's own JVMs, add
# REBOX_REA_ATTACH = "0" (without either, REA's Ghidra provider refuses to start).
[child.env]
REBOX_REA_ATTACH_HELPER = "/opt/rebox/rea-attach/helper.mjs"
# REA keeps its runtime roots (and the target snapshot the helper imports) under TMPDIR; the
# supervisor creates this directory and lets ghidra-mcp import from it (supervisor.REA_TMP).
# {NAME} is filled in from the supervisor's environment.
TMPDIR = "{REBOX_REA_TMP}"
# REA's session state (and annotations on targets in its own JVM) is private to the process; its
# evidence bundle keeps what it found. Run on session close and periodically when REBOX_STATE_DIR is
# set; {state_dir} and {session} are substituted. prune_empty deletes the file again when the
# bundle holds nothing.
[child.autosave]
tool = "export_evidence_bundle"
arguments = { path = "{state_dir}/rea/evidence/{session}.json", overwrite = true }
prune_empty = true
# close_binary clears REA's evidence ledger, so export before forwarding it.
before_tools = ["close_binary"]

[[child]]
name = "ghidra"
prefix = "ghidra_"
command = ["/opt/ghidra-mcp/venv/bin/bridge-mcp-ghidra", "--transport", "stdio"]
# Hidden from tools/list and refused on call. The child's own names, without the prefix.
deny = ["run_ghidra_script", "run_script_inline", "delete_project"]
[child.env]
GHIDRA_MCP_URL = "http://127.0.0.1:8089"
# The headless server and its project are shared by all sessions: never let a call fall back to
# another session's "current program".
GHIDRA_MCP_REQUIRE_PROGRAM_SELECTORS = "1"
# The Ghidra server starts with the first session, so a bridge usually boots before it and lists
# only its static tools. When the server is up (and the client has sent `initialized`) the bridge is
# told to connect to it. Its own 15 s retry is the fallback.
[child.on_ready]
tool = "connect_instance"
arguments = { project = "rebox" }
# Clients cannot be relied on to follow tools/list_changed, so a session advertises the bridge's
# full catalog from the first tools/list: the cached one (cache/rebox-catalog/ in the state dir)
# while Ghidra starts, and calls to its tools wait for the live bridge. The key names what changes
# the catalog; with no cache for it the supervisor fills one at container start. {file:...} is the
# stripped content of a file, {NAME} an environment variable.
[child.catalog_cache]
key = "{file:/opt/ghidra-mcp/VERSION}-lazy{GHIDRA_MCP_LAZY}-scripts{GHIDRA_MCP_ALLOW_SCRIPTS}"
