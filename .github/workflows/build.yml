# Unit tests on every push and PR; the pins check (it downloads hundreds of MB) only when something
# it covers changed, on v* tags and on manual runs. The image's test stage (the whole suite,
# docs/BUILDING.md) on PRs without pushing; on main and v* tags the release image is pushed to
# ghcr.io/<owner>/re-box.
name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}
  CACHE: ghcr.io/${{ github.repository }}:buildcache
  # The build-record artifact counts against the account's Actions storage quota; the logs suffice.
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      pins: ${{ steps.filter.outputs.pins }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        name: Did anything the pins check covers change?
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          pins=false
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || [ "$GITHUB_REF_TYPE" = tag ]; then
            pins=true
          else
            # HEAD is a PR's merge commit, so its first parent is the base.
            if [ "$GITHUB_EVENT_NAME" = pull_request ]; then base=HEAD^1; else base=$BEFORE; fi
            if files=$(git diff --name-only "$base" "$GITHUB_SHA" 2>/dev/null); then
              if echo "$files" | grep -Eq '^(versions\.env|scripts/check-pins\.py|renovate\.json|deps/rea/package-lock\.json|\.github/workflows/)'; then pins=true; fi
            else
              pins=true  # no usable base (new branch, force push): check
            fi
          fi
          echo "pins=$pins" >> "$GITHUB_OUTPUT"

  pins:
    needs: changes
    if: needs.changes.outputs.pins == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: versions.env digests match their URLs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check-pins.py

  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: check-pins unit tests (offline)
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Aggregator unit tests (fake children, no image)
        working-directory: aggregator
        run: |
          pipx install uv==0.13.1  # the Dockerfile's uv stage
          uv sync --frozen
          uv run --no-sync pytest -q -p no:cacheprovider tests

  image:
    # A skipped pins job (nothing it covers changed) does not hold the image back; a failed one does.
    needs: [changes, pins, unit]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.unit.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.pins.result) }}
    # Repository variable REBOX_RUNNER (JSON) moves this job off the hosted runner, e.g. '"re-box"'
    # for an ARC scale set; REBOX_BUILD_TIMEOUT raises the limit there (hosted jobs stop at 360).
    runs-on: ${{ fromJSON(vars.REBOX_RUNNER || '"ubuntu-24.04"') }}
    timeout-minutes: ${{ fromJSON(vars.REBOX_BUILD_TIMEOUT || '330') }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space
        # A hosted runner starts with ~20 GB free; layers, test stage and cache need more.
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/share/powershell
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Test stage (runs the whole suite)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: test
          platforms: linux/amd64
          push: false
          cache-from: type=registry,ref=${{ env.CACHE }}
      - name: Release image
        # Reuses the test stage from the builder; `final` cannot exist without it passing.
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: final
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=min
          cache-from: type=registry,ref=${{ env.CACHE }}
          # Registry, not gha: the gha cache is capped at 10 GB per repo, below this build's layers.
          cache-to: type=registry,ref=${{ env.CACHE }},mode=max,image-manifest=true,oci-mediatypes=true
