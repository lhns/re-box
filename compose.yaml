# Example deployment. Copy .env.example to .env and create the token file first:
#   openssl rand -hex 32 > rebox_token && chmod 600 rebox_token
# docs/OPERATIONS.md explains every knob, docs/PERSISTENCE.md what is kept where.
services:
  re-box:
    image: ${REBOX_IMAGE:-ghcr.io/lhns/re-box:latest}
    # Started as root only so the entrypoint can give `rebox` the host user's PUID/PGID (files in
    # the mounts then belong to you); it drops to that user before anything else runs. To skip the
    # remap, delete `user` and the three cap_add entries: the image then runs as uid 1000.
    user: "0:0"
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    environment:
      REBOX_TOKEN_FILE: /run/secrets/rebox_token
      RE_WORKDIR: ${RE_WORKDIR:?set RE_WORKDIR in .env}
      # Empty: state lives in $RE_WORKDIR/re-box-state and persists with the work dir.
      REBOX_STATE_DIR: ${REBOX_STATE_DIR:-}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    secrets: [rebox_token]
    # Targets run inside this container (docs/OPERATIONS.md, Security). To cut their egress, put the
    # service on an `internal` network (below) and reach it through a proxy on that network, since
    # an internal network cannot publish ports to the host; offline, symbol downloads stop.
    # networks: [analysis]
    volumes:
      # Create RE_WORKDIR on the host first (mkdir -p), or Docker creates it as root.
      # Same absolute path inside as outside: paths a client sends are valid here as they are,
      # and paths re-box writes are valid on the host.
      - ${RE_WORKDIR}:${RE_WORKDIR}
      # A separate state dir (e.g. an agent's scratchpad), also at its own path. Uncomment with
      # REBOX_STATE_DIR set in .env:
      # - ${REBOX_STATE_DIR}:${REBOX_STATE_DIR}
      # REA's per-session Ghidra projects and tool scratch space: a few GB per busy session.
      - rebox-tmp:/tmp
    ports:
      # Plain HTTP: keep it on loopback, or put a TLS proxy in front (docs/OPERATIONS.md, Security).
      - "127.0.0.1:8443:8443"
    deploy:
      resources:
        limits:
          # Fits the defaults: docs/OPERATIONS.md, Memory.
          memory: 16g
    healthcheck:
      test: ["CMD", "/usr/local/bin/re-box-healthcheck"]
      interval: 30s
      timeout: 10s
      # The aggregator answers at once; Ghidra starts with the first session and is not needed for 200.
      start_period: 30s
      retries: 3
    restart: unless-stopped
    # json-file never rotates by default; cap the container log (docs/OPERATIONS.md).
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    # Shutdown saves every Ghidra program and exports each REA session's evidence; Docker's
    # default 10 s can SIGKILL that half way (docs/PERSISTENCE.md).
    stop_grace_period: 120s
secrets:
  rebox_token:
    file: ./rebox_token
volumes:
  rebox-tmp:
